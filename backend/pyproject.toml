[project]
name = "personal-web-backend"
version = "0.1.0"
requires-python = ">=3.13,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "gunicorn==26.2.0",
    "pydantic-settings>=2,<3",
    "psycopg[binary]>=3.2,<4",
    "pwdlib[argon2]>=0.3,<1",
    "Pillow>=12,<13",
    "python-multipart>=0.0.22,<1",
]

[dependency-groups]
dev = ["httpx2>=2,<3"]
